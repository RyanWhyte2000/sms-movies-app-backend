# Azure DevOps Services CI with image publishing to Azure Container Registry.
name: movies-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - '*'

# For Azure Repos, configure a Build validation branch policy instead.
pr:
  autoCancel: true
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-24.04

variables:
  mavenCache: $(Pipeline.Workspace)/.m2/repository
  helmVersion: '3.17.3'
  azureServiceConnection: 'smsmovies2'
  azureResourceGroup: 'sms-movies'
  azureLocation: 'westus2'
  containerAppEnvironment: 'smsmovies'
  containerAppName: 'smsmovies'
  acrName: 'smsMovies'

stages:
  - stage: BuildAndTest
    displayName: Build, test and package
    jobs:
      - job: Verify
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Maven dependencies
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml | .mvn/wrapper/maven-wrapper.properties'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCache)

          - bash: |
              set -euo pipefail
              bash ./mvnw -B -ntp "-Dmaven.repo.local=$MAVEN_CACHE" clean verify
            displayName: Compile, test and package with Maven wrapper
            env:
              MAVEN_CACHE: $(mavenCache)

          - task: PublishTestResults@2
            displayName: Publish JUnit results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
              searchFolder: $(System.DefaultWorkingDirectory)
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              testRunTitle: Movies API - Java 17

          - bash: |
              set -euo pipefail
              test -s target/site/jacoco/jacoco.xml
              test -s target/site/jacoco/index.html
            displayName: Verify JaCoCo report was generated

          - task: PublishCodeCoverageResults@2
            displayName: Publish JaCoCo to Code Coverage tab
            inputs:
              summaryFileLocation: $(Build.SourcesDirectory)/target/site/jacoco/jacoco.xml
              pathToSources: $(Build.SourcesDirectory)/src/main/java
              failIfCoverageEmpty: true

          - task: PublishPipelineArtifact@1
            displayName: Publish browsable JaCoCo HTML report
            inputs:
              targetPath: $(Build.SourcesDirectory)/target/site/jacoco
              artifact: jacoco-html
              publishLocation: pipeline

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: $(helmVersion)

          - bash: |
              set -euo pipefail
              mkdir -p "$ARTIFACT_DIR/helm"
              helm lint ./helm/movies --strict
              helm template movies ./helm/movies > "$ARTIFACT_DIR/helm/rendered-local.yaml"
              helm package ./helm/movies --destination "$ARTIFACT_DIR/helm"
            displayName: Validate and package Helm chart
            env:
              ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)

          - task: Docker@2
            displayName: Validate Docker image build
            inputs:
              command: build
              repository: movies-api
              Dockerfile: $(Build.SourcesDirectory)/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              tags: |
                $(Build.BuildId)

          - bash: |
              set -euo pipefail
              mkdir -p "$ARTIFACT_DIR/app" "$ARTIFACT_DIR/docs"
              cp target/movies-*.jar "$ARTIFACT_DIR/app/"
              cp README.md "$ARTIFACT_DIR/"
              cp azure-pipelines.yml "$ARTIFACT_DIR/"
              cp -R docs/. "$ARTIFACT_DIR/docs/"
              cp -R helm/movies "$ARTIFACT_DIR/helm/"
            displayName: Stage application and documentation
            env:
              ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish application and Helm artifacts
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: movies-build
              publishLocation: pipeline

  - stage: BuildAndPushImage
    displayName: Build and push image to ACR
    dependsOn: BuildAndTest
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: PushImage
        displayName: Build and push immutable image
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Build locally and push image to ACR
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr show \
                  --name "$(acrName)" \
                  --query loginServer \
                  --output tsv \
                  --only-show-errors > "$AGENT_TEMPDIRECTORY/acr-login-server"
                read -r login_server < "$AGENT_TEMPDIRECTORY/acr-login-server"
                image="${login_server}/movies-api:$(Build.BuildId)"
                az acr login --name "$(acrName)" --only-show-errors
                docker build \
                  --file "$(Build.SourcesDirectory)/Dockerfile" \
                  --tag "$image" \
                  "$(Build.SourcesDirectory)"
                docker push "$image"
                echo "Pushed image: $image"

  - stage: DeployContainerApp
    displayName: Deploy Azure Container App
    dependsOn: BuildAndPushImage
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy immutable ACR image
        timeoutInMinutes: 30
        steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: Configure identity and deploy movies API
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                for variable_name in DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
                  variable_value="${!variable_name:-}"
                  if [[ -z "$variable_value" || "$variable_value" == '$('* ]]; then
                    echo "##vso[task.logissue type=error]Pipeline variable $variable_name is missing."
                    exit 1
                  fi
                done
                environment_values=(
                  "SPRING_PROFILES_ACTIVE=production"
                  "DATABASE_URL=$DATABASE_URL"
                  "DATABASE_USERNAME=$DATABASE_USERNAME"
                  "DATABASE_PASSWORD=$DATABASE_PASSWORD"
                )
                if [[ -n "${APP_CORS_ALLOWED_ORIGINS:-}" && "$APP_CORS_ALLOWED_ORIGINS" != '$('* ]]; then
                  environment_values+=("APP_CORS_ALLOWED_ORIGINS=$APP_CORS_ALLOWED_ORIGINS")
                fi

                az acr show \
                  --name "$(acrName)" \
                  --query loginServer \
                  --output tsv \
                  --only-show-errors > "$AGENT_TEMPDIRECTORY/acr-login-server"
                read -r login_server < "$AGENT_TEMPDIRECTORY/acr-login-server"
                image="${login_server}/movies-api:$(Build.BuildId)"

                az containerapp identity assign \
                  --name "$(containerAppName)" \
                  --resource-group "$(azureResourceGroup)" \
                  --system-assigned \
                  --only-show-errors > /dev/null

                az containerapp registry set \
                  --name "$(containerAppName)" \
                  --resource-group "$(azureResourceGroup)" \
                  --server "$login_server" \
                  --identity system \
                  --only-show-errors
                az containerapp ingress enable \
                  --name "$(containerAppName)" \
                  --resource-group "$(azureResourceGroup)" \
                  --type external \
                  --target-port 8080 \
                  --only-show-errors

                revision_suffix="b$(Build.BuildId)-a$(System.JobAttempt)"
                revision_name=""

                print_diagnostics() {
                  set +e
                  echo "Revision status:"
                  az containerapp revision list \
                    --name "$(containerAppName)" \
                    --resource-group "$(azureResourceGroup)" \
                    --all \
                    --query "[].{Name:name,Active:properties.active,Provisioning:properties.provisioningState,Running:properties.runningState,Health:properties.healthState,Error:properties.provisioningError,Created:properties.createdTime}" \
                    --output table
                  echo "System logs:"
                  log_revision_args=()
                  if [[ -n "$revision_name" ]]; then
                    log_revision_args=(--revision "$revision_name")
                  fi
                  az containerapp logs show \
                    --name "$(containerAppName)" \
                    --resource-group "$(azureResourceGroup)" \
                    "${log_revision_args[@]}" \
                    --type system \
                    --tail 100 \
                    --format text
                  echo "Application logs (when a replica was created):"
                  az containerapp logs show \
                    --name "$(containerAppName)" \
                    --resource-group "$(azureResourceGroup)" \
                    "${log_revision_args[@]}" \
                    --type console \
                    --tail 100 \
                    --format text
                  set -e
                }

                if ! az containerapp update \
                    --name "$(containerAppName)" \
                    --resource-group "$(azureResourceGroup)" \
                    --image "$image" \
                    --cpu 0.5 \
                    --memory 1.0Gi \
                    --min-replicas 0 \
                    --max-replicas 1 \
                    --revision-suffix "$revision_suffix" \
                    --set-env-vars "${environment_values[@]}" \
                    --no-wait \
                    --only-show-errors; then
                  echo "##vso[task.logissue type=error]Azure rejected the Container App update request."
                  print_diagnostics
                  exit 1
                fi

                echo "Update accepted. Waiting for revision suffix $revision_suffix to provision."
                for attempt in {1..60}; do
                  revision_name="$(az containerapp revision list \
                    --name "$(containerAppName)" \
                    --resource-group "$(azureResourceGroup)" \
                    --all \
                    --query "[?ends_with(name, '-${revision_suffix}')].name | [0]" \
                    --output tsv \
                    --only-show-errors || true)"

                  if [[ -n "$revision_name" ]]; then
                    read -r provisioning_state running_state < <(az containerapp revision show \
                      --name "$(containerAppName)" \
                      --resource-group "$(azureResourceGroup)" \
                      --revision "$revision_name" \
                      --query "[properties.provisioningState, properties.runningState]" \
                      --output tsv \
                      --only-show-errors || true)
                    echo "Attempt $attempt/60: revision=$revision_name provisioning=${provisioning_state:-unknown} running=${running_state:-unknown}"

                    if [[ "$provisioning_state" == "Provisioned" ]]; then
                      break
                    fi
                    if [[ "$provisioning_state" == "Failed" || "$running_state" == "Failed" || "$running_state" == "Degraded" ]]; then
                      provisioning_error="$(az containerapp revision show \
                        --name "$(containerAppName)" \
                        --resource-group "$(azureResourceGroup)" \
                        --revision "$revision_name" \
                        --query "properties.provisioningError" \
                        --output tsv \
                        --only-show-errors || true)"
                      echo "##vso[task.logissue type=error]Revision $revision_name failed: ${provisioning_error:-no provisioning error was returned}."
                      print_diagnostics
                      exit 1
                    fi
                  else
                    echo "Attempt $attempt/60: Azure has not exposed the new revision yet."
                  fi

                  if [[ "$attempt" == "60" ]]; then
                    echo "##vso[task.logissue type=error]Revision with suffix $revision_suffix did not provision within 10 minutes."
                    print_diagnostics
                    exit 1
                  fi
                  sleep 10
                done

                az containerapp show \
                  --name "$(containerAppName)" \
                  --resource-group "$(azureResourceGroup)" \
                  --query "properties.configuration.ingress.fqdn" \
                  --output tsv
            env:
              DATABASE_URL: $(DATABASE_URL)
              DATABASE_USERNAME: $(DATABASE_USERNAME)
              DATABASE_PASSWORD: $(DATABASE_PASSWORD)
              APP_CORS_ALLOWED_ORIGINS: $(APP_CORS_ALLOWED_ORIGINS)
