spring.application.name=movies
spring.profiles.default=local

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:120}
app.rate-limit.window=${APP_RATE_LIMIT_WINDOW:60s}
app.rate-limit.max-tracked-clients=${APP_RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.ai.model=${OPENAI_MODEL:gpt-4.1-mini-2025-04-14}
app.ai.connect-timeout=${APP_AI_CONNECT_TIMEOUT:2s}
app.ai.read-timeout=${APP_AI_READ_TIMEOUT:5s}
app.ai.minimum-confidence=${APP_AI_MINIMUM_CONFIDENCE:0.55}
app.ai.candidate-limit=${APP_AI_CANDIDATE_LIMIT:80}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DATABASE_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DATABASE_MAX_LIFETIME_MS:600000}
spring.datasource.hikari.pool-name=MoviesPool

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing PostgreSQL schema
spring.sql.init.mode=never
spring.session.jdbc.initialize-schema=never
spring.docker.compose.enabled=false
